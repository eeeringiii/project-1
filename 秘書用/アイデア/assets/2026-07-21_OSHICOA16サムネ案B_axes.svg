<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b1c"/>
      <stop offset="100%" stop-color="#090914"/>
    </linearGradient>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8c7ff"/>
    </marker>
  </defs>

  <rect width="1280" height="670" fill="url(#bg)"/>

  <!-- header -->
  <text x="80" y="118" fill="#8f8aa8" font-size="20" letter-spacing="6">FOUR DIRECTIONS OF LOVE</text>
  <text x="76" y="196" fill="#f4f2ff" font-size="64" font-weight="800">OSHICOA <tspan fill="#e8c7ff">16</tspan></text>
  <text x="80" y="242" fill="#c7c1dc" font-size="26" font-weight="600">あなたの&#8220;推し方の本性&#8221;を、16のヲタク生態に分類する。</text>

  <!-- 4 axis rows -->
  <g>
    <!-- row template: left pole (right-anchored) | arrow | right pole -->
    <!-- axis 1 -->
    <text x="70" y="335" fill="#6d6788" font-size="16" font-weight="700">R / C</text>
    <text x="470" y="336" fill="#f4f2ff" font-size="30" font-weight="700" text-anchor="end">共鳴</text>
    <line x1="500" y1="328" x2="720" y2="328" stroke="#e8c7ff" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
    <text x="750" y="336" fill="#f4f2ff" font-size="30" font-weight="700">接続</text>
    <text x="1210" y="336" fill="#8f8aa8" font-size="17" text-anchor="end">作品に潜る ↔ 本人とつながる</text>

    <!-- axis 2 -->
    <text x="70" y="405" fill="#6d6788" font-size="16" font-weight="700">E / P</text>
    <text x="470" y="406" fill="#f4f2ff" font-size="30" font-weight="700" text-anchor="end">体験</text>
    <line x1="500" y1="398" x2="720" y2="398" stroke="#e8c7ff" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
    <text x="750" y="406" fill="#f4f2ff" font-size="30" font-weight="700">所有</text>
    <text x="1210" y="406" fill="#8f8aa8" font-size="17" text-anchor="end">その瞬間を生きる ↔ 形に残す</text>

    <!-- axis 3 -->
    <text x="70" y="475" fill="#6d6788" font-size="16" font-weight="700">G / M</text>
    <text x="470" y="476" fill="#f4f2ff" font-size="30" font-weight="700" text-anchor="end">成長支援</text>
    <line x1="500" y1="468" x2="720" y2="468" stroke="#f472b6" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
    <text x="750" y="476" fill="#f4f2ff" font-size="30" font-weight="700">自己充足</text>
    <text x="1210" y="476" fill="#8f8aa8" font-size="17" text-anchor="end">未来を動かす ↔ 感情を守る</text>

    <!-- axis 4 -->
    <text x="70" y="545" fill="#6d6788" font-size="16" font-weight="700">T / S</text>
    <text x="470" y="546" fill="#f4f2ff" font-size="30" font-weight="700" text-anchor="end">連帯</text>
    <line x1="500" y1="538" x2="720" y2="538" stroke="#f472b6" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
    <text x="750" y="546" fill="#f4f2ff" font-size="30" font-weight="700">単独</text>
    <text x="1210" y="546" fill="#8f8aa8" font-size="17" text-anchor="end">ファンダムと熱狂 ↔ 自分のペース</text>
  </g>

  <text x="80" y="618" fill="#f472b6" font-size="22" font-weight="700">#OSHICOA16</text>
  <text x="1210" y="618" fill="#8f8aa8" font-size="18" text-anchor="end">無料診断・全24問・約3〜4分</text>
</svg>
