<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ecfc"/>
      <stop offset="100%" stop-color="#fbeef6"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#ffb6dc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb6dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9b3f2"/>
      <stop offset="100%" stop-color="#ffc2df"/>
    </linearGradient>
    <marker id="b2" markerWidth="12" markerHeight="12" refX="6" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#ff8fc0" stroke="#ff8fc0" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="670" fill="url(#bg2)"/>
  <rect width="1280" height="670" fill="url(#glow2)"/>
  <rect x="28" y="28" width="1224" height="614" rx="40" fill="none" stroke="#9d7fe0" stroke-opacity="0.4" stroke-width="3"/>

  <!-- header -->
  <text x="80" y="112" fill="#8b6fd6" font-size="40" font-weight="700">OSHICOA 16</text>
  <text x="1200" y="110" fill="#9a8dc0" font-size="26" font-weight="500" text-anchor="end">ヲタク生態診断</text>
  <text x="80" y="176" fill="#4b3f77" font-size="36" font-weight="700">あなたの&#8220;推し方の本性&#8221;を、16のヲタク生態に。</text>
  <text x="82" y="216" fill="#6a5c95" font-size="24" font-weight="500">愛の量じゃなくて、愛が&#8220;どこへ向かうか&#8221;。</text>

  <!-- 4 axis rows -->
  <g>
    <!-- axis 1 -->
    <text x="80" y="316" fill="#c3a9e0" font-size="17" font-weight="700">R / C</text>
    <text x="470" y="318" fill="#4b3f77" font-size="31" font-weight="700" text-anchor="end">共鳴</text>
    <line x1="500" y1="310" x2="720" y2="310" stroke="#ff8fc0" stroke-width="5" stroke-linecap="round" marker-start="url(#b2)" marker-end="url(#b2)"/>
    <text x="750" y="318" fill="#4b3f77" font-size="31" font-weight="700">接続</text>
    <text x="1200" y="318" fill="#9a8dc0" font-size="18" font-weight="500" text-anchor="end">作品に潜る ↔ 本人とつながる</text>

    <!-- axis 2 -->
    <text x="80" y="388" fill="#c3a9e0" font-size="17" font-weight="700">E / P</text>
    <text x="470" y="390" fill="#4b3f77" font-size="31" font-weight="700" text-anchor="end">体験</text>
    <line x1="500" y1="382" x2="720" y2="382" stroke="#9d7fe0" stroke-width="5" stroke-linecap="round" marker-start="url(#b2)" marker-end="url(#b2)"/>
    <text x="750" y="390" fill="#4b3f77" font-size="31" font-weight="700">所有</text>
    <text x="1200" y="390" fill="#9a8dc0" font-size="18" font-weight="500" text-anchor="end">その瞬間を生きる ↔ 形に残す</text>

    <!-- axis 3 -->
    <text x="80" y="460" fill="#c3a9e0" font-size="17" font-weight="700">G / M</text>
    <text x="470" y="462" fill="#4b3f77" font-size="31" font-weight="700" text-anchor="end">成長支援</text>
    <line x1="500" y1="454" x2="720" y2="454" stroke="#ff8fc0" stroke-width="5" stroke-linecap="round" marker-start="url(#b2)" marker-end="url(#b2)"/>
    <text x="750" y="462" fill="#4b3f77" font-size="31" font-weight="700">自己充足</text>
    <text x="1200" y="462" fill="#9a8dc0" font-size="18" font-weight="500" text-anchor="end">未来を動かす ↔ 感情を守る</text>

    <!-- axis 4 -->
    <text x="80" y="532" fill="#c3a9e0" font-size="17" font-weight="700">T / S</text>
    <text x="470" y="534" fill="#4b3f77" font-size="31" font-weight="700" text-anchor="end">連帯</text>
    <line x1="500" y1="526" x2="720" y2="526" stroke="#9d7fe0" stroke-width="5" stroke-linecap="round" marker-start="url(#b2)" marker-end="url(#b2)"/>
    <text x="750" y="534" fill="#4b3f77" font-size="31" font-weight="700">単独</text>
    <text x="1200" y="534" fill="#9a8dc0" font-size="18" font-weight="500" text-anchor="end">ファンダムと熱狂 ↔ 自分のペース</text>
  </g>

  <!-- hashtag pill + note -->
  <rect x="80" y="576" width="316" height="54" rx="27" fill="url(#pill2)"/>
  <text x="238" y="611" fill="#ffffff" font-size="25" font-weight="700" text-anchor="middle">#OSHICOA16</text>
  <text x="1200" y="611" fill="#a99fc4" font-size="19" font-weight="500" text-anchor="end">無料診断・全24問・約3〜4分</text>
</svg>
