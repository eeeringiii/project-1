<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ecfc"/>
      <stop offset="100%" stop-color="#fbeef6"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ffb6dc" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffb6dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9b3f2"/>
      <stop offset="100%" stop-color="#ffc2df"/>
    </linearGradient>
    <marker id="ap" markerWidth="11" markerHeight="11" refX="6" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#ff8fc0" stroke="#ff8fc0" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <marker id="av" markerWidth="11" markerHeight="11" refX="6" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#9d7fe0" stroke="#9d7fe0" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="670" fill="url(#bg)"/>
  <rect width="1280" height="670" fill="url(#glow)"/>
  <rect x="28" y="28" width="1224" height="614" rx="40" fill="none" stroke="#9d7fe0" stroke-opacity="0.4" stroke-width="3"/>

  <!-- logo row -->
  <text x="80" y="118" fill="#8b6fd6" font-size="40" font-weight="700">OSHICOA 16</text>
  <text x="1200" y="116" fill="#9a8dc0" font-size="26" font-weight="500" text-anchor="end">ヲタク生態診断</text>

  <!-- title (kept clear of compass) -->
  <text x="80" y="270" fill="#4b3f77" font-size="46" font-weight="700">推しが変わっても、</text>
  <text x="80" y="332" fill="#4b3f77" font-size="46" font-weight="700">あなたの&#8220;推し方&#8221;は変わらない。</text>

  <!-- sub -->
  <text x="82" y="404" fill="#6a5c95" font-size="25" font-weight="500">愛の量じゃなくて、愛の&#8220;向き&#8221;。</text>
  <text x="82" y="442" fill="#6a5c95" font-size="25" font-weight="500">16のヲタク生態で、やさしく解析。</text>

  <!-- hashtag pill -->
  <rect x="80" y="496" width="316" height="58" rx="29" fill="url(#pill)"/>
  <text x="238" y="534" fill="#ffffff" font-size="27" font-weight="700" text-anchor="middle">#OSHICOA16</text>

  <!-- footer tagline -->
  <text x="82" y="602" fill="#a99fc4" font-size="23" font-weight="500">oshicoa16 — あなたの推し方の本性は？</text>

  <!-- compass (center 1015,362 r=150) -->
  <circle cx="1015" cy="362" r="150" fill="#fdf4fb" stroke="#9d7fe0" stroke-opacity="0.3" stroke-width="2.5"/>
  <circle cx="1015" cy="362" r="150" fill="none" stroke="#ff8fc0" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>

  <line x1="885" y1="362" x2="1145" y2="362" stroke="#ff8fc0" stroke-width="5" stroke-linecap="round" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <line x1="1015" y1="242" x2="1015" y2="482" stroke="#9d7fe0" stroke-width="5" stroke-linecap="round" marker-start="url(#av)" marker-end="url(#av)"/>
  <line x1="1107" y1="270" x2="923" y2="454" stroke="#ff8fc0" stroke-width="5" stroke-linecap="round" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <line x1="923" y1="270" x2="1107" y2="454" stroke="#9d7fe0" stroke-width="5" stroke-linecap="round" marker-start="url(#av)" marker-end="url(#av)"/>

  <!-- heart center -->
  <path d="M1015 379 c-16 -16 -31 -27 -31 -42 c0 -10 8 -17 17 -17 c7 0 11 4 14 8 c3 -4 7 -8 14 -8 c9 0 17 7 17 17 c0 15 -15 26 -31 42 z" fill="#ff6fa3"/>

  <!-- pole labels -->
  <text x="878" y="368" fill="#4b3f77" font-size="22" font-weight="700" text-anchor="end">共鳴</text>
  <text x="1152" y="368" fill="#4b3f77" font-size="22" font-weight="700">接続</text>
  <text x="1015" y="228" fill="#4b3f77" font-size="22" font-weight="700" text-anchor="middle">体験</text>
  <text x="1015" y="512" fill="#4b3f77" font-size="22" font-weight="700" text-anchor="middle">所有</text>
  <text x="1120" y="258" fill="#9a8dc0" font-size="17" font-weight="700">成長支援</text>
  <text x="910" y="474" fill="#9a8dc0" font-size="17" font-weight="700" text-anchor="end">自己充足</text>
  <text x="910" y="258" fill="#9a8dc0" font-size="17" font-weight="700" text-anchor="end">連帯</text>
  <text x="1120" y="474" fill="#9a8dc0" font-size="17" font-weight="700">単独</text>
</svg>
