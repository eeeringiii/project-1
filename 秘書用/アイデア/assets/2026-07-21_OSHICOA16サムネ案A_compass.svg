<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ecfc"/>
      <stop offset="100%" stop-color="#fbeef6"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ffb6dc" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffb6dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9b3f2"/>
      <stop offset="100%" stop-color="#ffc2df"/>
    </linearGradient>
    <marker id="ap" markerWidth="11" markerHeight="11" refX="6" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#ff8fc0" stroke="#ff8fc0" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <marker id="av" markerWidth="11" markerHeight="11" refX="6" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#9d7fe0" stroke="#9d7fe0" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="670" fill="url(#bg)"/>
  <rect width="1280" height="670" fill="url(#glow)"/>
  <rect x="28" y="28" width="1224" height="614" rx="40" fill="none" stroke="#9d7fe0" stroke-opacity="0.4" stroke-width="3"/>

  <!-- logo row -->
  <text x="80" y="118" fill="#8b6fd6" font-size="40" font-weight="700">OSHICOA 16</text>
  <text x="1200" y="116" fill="#9a8dc0" font-size="26" font-weight="500" text-anchor="end">ヲタク生態診断</text>

  <!-- title -->
  <text x="80" y="250" fill="#4b3f77" font-size="52" font-weight="700">推しが変わっても、</text>
  <text x="80" y="316" fill="#4b3f77" font-size="52" font-weight="700">あなたの&#8220;推し方&#8221;は変わらない。</text>

  <!-- sub -->
  <text x="82" y="392" fill="#6a5c95" font-size="26" font-weight="500">愛の量じゃなくて、愛の&#8220;向き&#8221;。</text>
  <text x="82" y="430" fill="#6a5c95" font-size="26" font-weight="500">16のヲタク生態で、やさしく解析。</text>

  <!-- hashtag pill -->
  <rect x="80" y="486" width="316" height="58" rx="29" fill="url(#pill)"/>
  <text x="238" y="524" fill="#ffffff" font-size="27" font-weight="700" text-anchor="middle">#OSHICOA16</text>

  <!-- footer tagline -->
  <text x="82" y="600" fill="#a99fc4" font-size="23" font-weight="500">oshicoa16 — あなたの推し方の本性は？</text>

  <!-- compass (center 968,338 r=190) -->
  <circle cx="968" cy="338" r="190" fill="#fdf4fb" stroke="#9d7fe0" stroke-opacity="0.3" stroke-width="2.5"/>
  <circle cx="968" cy="338" r="190" fill="none" stroke="#ff8fc0" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>

  <line x1="820" y1="338" x2="1116" y2="338" stroke="#ff8fc0" stroke-width="5" stroke-linecap="round" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <line x1="968" y1="204" x2="968" y2="472" stroke="#9d7fe0" stroke-width="5" stroke-linecap="round" marker-start="url(#av)" marker-end="url(#av)"/>
  <line x1="1072" y1="234" x2="864" y2="442" stroke="#ff8fc0" stroke-width="5" stroke-linecap="round" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <line x1="864" y1="234" x2="1072" y2="442" stroke="#9d7fe0" stroke-width="5" stroke-linecap="round" marker-start="url(#av)" marker-end="url(#av)"/>

  <!-- heart center -->
  <path d="M968 356 c-17 -17 -33 -29 -33 -45 c0 -11 9 -18 18 -18 c8 0 12 5 15 9 c3 -4 7 -9 15 -9 c9 0 18 7 18 18 c0 16 -16 28 -33 45 z" fill="#ff6fa3"/>

  <!-- pole labels -->
  <text x="810" y="344" fill="#4b3f77" font-size="24" font-weight="700" text-anchor="end">共鳴</text>
  <text x="1126" y="344" fill="#4b3f77" font-size="24" font-weight="700">接続</text>
  <text x="968" y="190" fill="#4b3f77" font-size="24" font-weight="700" text-anchor="middle">体験</text>
  <text x="968" y="500" fill="#4b3f77" font-size="24" font-weight="700" text-anchor="middle">所有</text>
  <text x="1088" y="224" fill="#9a8dc0" font-size="18" font-weight="700">成長支援</text>
  <text x="848" y="462" fill="#9a8dc0" font-size="18" font-weight="700" text-anchor="end">自己充足</text>
  <text x="848" y="224" fill="#9a8dc0" font-size="18" font-weight="700" text-anchor="end">連帯</text>
  <text x="1088" y="462" fill="#9a8dc0" font-size="18" font-weight="700">単独</text>
</svg>
